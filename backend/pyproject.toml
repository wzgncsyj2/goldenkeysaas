[project]
name = "goldenkey-saas"
version = "0.1.0"
description = "金钥匙智知 - 企业级AI知识库+在线客服SaaS平台"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "GoldenKey AI Team", email = "dev@goldenkey.ai"}
]

dependencies = [
    # Web Framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    
    # Database
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",      # PostgreSQL async driver
    "aiosqlite>=0.19.0",    # SQLite async driver (dev)
    
    # Authentication
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",        # Pin: 4.1+ breaks passlib
    "python-multipart>=0.0.6",
    
    # Vector Database
    "chromadb>=0.4.22",
    
    # LLM & RAG
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-community>=0.0.15",
    "openai>=1.10.0",
    
    # Document Parsing
    "pdfplumber>=0.10.3",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "python-pptx>=0.6.23",
    "pandas>=2.2.0",
    "chardet>=5.2.0",
    
    # HTTP Client
    "httpx>=0.26.0",
    "aiohttp>=3.9.0",
    
    # Logging
    "structlog>=24.1.0",
    
    # Utils
    "python-dotenv>=1.0.0",
    "orjson>=3.9.0",        # Fast JSON serialization
    "email-validator>=2.1.0",  # Pydantic EmailStr 需要
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",        # For TestClient
    "black>=24.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

prod = [
    "gunicorn>=21.2.0",
    "psycopg2-binary>=2.9.9",  # PostgreSQL driver
    "redis>=5.0.0",
    "celery>=5.3.0",           # Task queue
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]  # Line length handled by Black

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "migrations*", "data*", "uploads*"]
